<div class="grupo-list">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="card-title">Gestión de Grupos</h2>
      <button class="btn btn-success" (click)="openCreateModal()">Nuevo Grupo</button>
    </div>

    <div class="card-body">
      <!-- 🔎 Filtros -->
      <div class="filters mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <input
              type="text"
              class="form-control"
              placeholder="Buscar por nombre de grupo..."
              [(ngModel)]="filters.nombre"
              (input)="onFilterChange()"
            />
          </div>
          <div class="col-md-3">
            <select
              class="form-control"
              [(ngModel)]="filters.activo"
              (change)="onFilterChange()"
            >
              <option value="">Todos los estados</option>
              <option value="true">Activos</option>
              <option value="false">Inactivos</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-secondary w-100" (click)="clearFilters()">
              Limpiar
            </button>
          </div>
        </div>
      </div>

      <!-- 📋 Tabla de grupos -->
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>GRUPO</th>
              <th>MATERIA</th>
              <th>PROFESOR</th>
              <th>ESTADO</th>
              <th class="text-center">ACCIONES</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading">
              <td colspan="6" class="text-center">Cargando...</td>
            </tr>

            <tr *ngIf="!loading && grupos.length === 0">
              <td colspan="6" class="text-center">No hay grupos registrados</td>
            </tr>

            <tr *ngFor="let grupo of grupos">
              <td>{{ grupo.nombre }}</td>
              <td>{{ grupo.materia?.nombre || 'Sin asignar' }}</td>
              <td>{{ grupo.profesor?.nombre || 'Sin asignar' }}</td>
              <td>
                <span
                  class="badge px-3 py-2"
                  [ngClass]="grupo.activo ? 'bg-success' : 'bg-danger'"
                >
                  {{ grupo.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td class="text-center">
                <button class="btn btn-sm btn-primary me-2" (click)="editGrupo(grupo)">
                  <i class="bi bi-pencil-square"></i> Editar
                </button>
                <button class="btn btn-sm btn-danger" (click)="deleteGrupo(grupo)">
                  <i class="bi bi-trash"></i> Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 📄 Paginación -->
      <div class="pagination mt-3 text-center" *ngIf="totalPages > 1">
        <button
          class="btn btn-secondary"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          Anterior
        </button>
        <span class="mx-3">Página {{ currentPage }} de {{ totalPages }}</span>
        <button
          class="btn btn-secondary"
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
        >
          Siguiente
        </button>
        
      </div>
    </div>
  </div>
</div>
