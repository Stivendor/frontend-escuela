<div class="periodo-list">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="card-title">Gestión de Periodos</h2>
      <button class="btn btn-success" (click)="openCreateModal()">Nuevo Periodo</button>
    </div>

    <div class="card-body">
      <!-- 🔍 Filtros -->
      <div class="filters mb-3">
        <div class="row">
          <div class="col-md-4">
            <input
              type="text"
              class="form-control"
              placeholder="Buscar por nombre de periodo..."
              [(ngModel)]="filters.nombre"
              (input)="onFilterChange()"
            />
          </div>
          <div class="col-md-3">
            <select
              class="form-control"
              [(ngModel)]="filters.activo"
              (change)="onFilterChange()"
            >
              <option value="">Todos los estados</option>
              <option value="true">Activos</option>
              <option value="false">Inactivos</option>
            </select>
          </div>
          <div class="col-md-2">
            <button class="btn btn-secondary" (click)="clearFilters()">Limpiar</button>
          </div>
        </div>
      </div>

      <!-- 📋 Tabla de periodos -->
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Periodo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading">
              <td colspan="3" class="text-center">Cargando...</td>
            </tr>
            <tr *ngIf="!loading && periodos.length === 0">
              <td colspan="3" class="text-center">No hay periodos registrados</td>
            </tr>
            <tr *ngFor="let periodo of periodos">
              <td>{{ periodo.nombre }}</td>
              <td>
                <span class="badge" [class.bg-success]="periodo.activo" [class.bg-danger]="!periodo.activo">
                  {{ periodo.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-primary me-2" (click)="editPeriodo(periodo)">Editar</button>
                <button class="btn btn-sm btn-danger" (click)="deletePeriodo(periodo)">Eliminar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 📄 Paginación -->
      <div class="pagination mt-3 text-center" *ngIf="totalPages > 1">
        <button
          class="btn btn-secondary"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          Anterior
        </button>
        <span class="mx-3">Página {{ currentPage }} de {{ totalPages }}</span>
        <button
          class="btn btn-secondary"
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
        >
          Siguiente
        </button>
      </div>
    </div>
  </div>

  <!-- 🧩 Modal para crear/editar periodo -->
  <div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ editingPeriodo ? 'Editar Periodo' : 'Nuevo Periodo' }}</h5>
          <button type="button" class="close" (click)="closeModal()">
            <span>&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <form (ngSubmit)="savePeriodo()">
            <div class="form-group mb-3">
              <label for="nombre">Nombre *</label>
              <input
                type="text"
                class="form-control"
                id="nombre"
                [(ngModel)]="periodoForm.nombre"
                name="nombre"
                required
                placeholder="Ingrese el nombre del periodo"
              />
            </div>

            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="activo"
                [(ngModel)]="periodoForm.activo"
                name="activo"
              />
              <label class="form-check-label" for="activo">Periodo activo</label>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
          <button type="button" class="btn btn-primary" (click)="savePeriodo()">
            {{ editingPeriodo ? 'Actualizar' : 'Crear' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
